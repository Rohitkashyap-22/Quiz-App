<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Quiz</title>
</head>

<body>
    <h1> Quiz </h1>
    <h2> Choose topic for your Test ! </h2>
    <div class="selectquiz">
        <div class="set">
            <h2 class="heading" id="HTML">HTML Quiz Set</h2>
            <hr>
            <label for="htmlInput">No. of Questions: </label>
            <input type="number" name="htmlInput" value="" id="htmlInput">
        </div>
        <!----------------------------------------------------------------->
        <div class="set">
            <h2 class="heading" id="CSS">CSS Quiz Set</h2>
            <hr>
            <label for="cssInput">No. of Questions: </label>
            <input type="number" name="cssInput" value="" id="cssInput">

        </div>
        <!----------------------------------------------------------------->
        <div class="set">
            <h2 class="heading" id="JS">Javacript Quiz Set</h2>
            <hr style="margin-right: 30px;">
            <label for="jsInput">No. of Questions: </label>
            <input type="number" name="jsInput" value="" id="jsInput">
        </div>
    </div>

    <script src="redirector.js"></script>

</body>

</html>
